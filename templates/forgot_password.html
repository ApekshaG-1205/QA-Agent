{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="card" id="forgotCard">
  <h1>Forgot password</h1>
  <p class="subtitle">Enter your email and we'll generate a reset link</p>

  <form id="forgotForm" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="jane@example.com" required />

    <button type="submit" id="forgotBtn">Send reset link</button>
  </form>

  <div id="message" class="message" role="alert"></div>

  <div id="devLinkBox" class="dev-link-box" style="display:none;">
    <p class="dev-note">No email server is configured in this test app — here's the link that would normally be emailed:</p>
    <a id="devResetLink" href="#"></a>
  </div>

  <p class="footer-link"><a href="/login">Back to login</a></p>
</div>

<script>
  const form = document.getElementById("forgotForm");
  const messageEl = document.getElementById("message");
  const devLinkBox = document.getElementById("devLinkBox");
  const devResetLink = document.getElementById("devResetLink");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageEl.textContent = "";
    messageEl.className = "message";
    devLinkBox.style.display = "none";

    const payload = { email: document.getElementById("email").value };

    try {
      const res = await fetch("/api/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (res.ok && data.ok) {
        messageEl.textContent = data.message;
        messageEl.classList.add("success");
        if (data.reset_link) {
          devResetLink.href = data.reset_link;
          devResetLink.textContent = data.reset_link;
          devLinkBox.style.display = "block";
        }
      } else {
        messageEl.textContent = data.error || "Something went wrong.";
        messageEl.classList.add("error");
      }
    } catch (err) {
      messageEl.textContent = "Network error. Please try again.";
      messageEl.classList.add("error");
    }
  });
</script>
{% endblock %}
