{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="card" id="resetCard">
  <h1>Reset password</h1>
  <p class="subtitle">Choose a new password for your account</p>

  <form id="resetForm" novalidate>
    <input type="hidden" id="token" value="{{ token }}" />

    <label for="new_password">New password</label>
    <input type="password" id="new_password" name="new_password" placeholder="At least 6 characters" required />

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required />

    <button type="submit" id="resetBtn">Reset password</button>
  </form>

  <div id="message" class="message" role="alert"></div>

  <p class="footer-link"><a href="/login">Back to login</a></p>
</div>

<script>
  const form = document.getElementById("resetForm");
  const messageEl = document.getElementById("message");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageEl.textContent = "";
    messageEl.className = "message";

    const payload = {
      token: document.getElementById("token").value,
      new_password: document.getElementById("new_password").value,
      confirm_password: document.getElementById("confirm_password").value,
    };

    try {
      const res = await fetch("/api/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (res.ok && data.ok) {
        messageEl.textContent = "Password reset! Redirecting to login...";
        messageEl.classList.add("success");
        setTimeout(() => (window.location.href = "/login"), 1200);
      } else {
        messageEl.textContent = data.error || "Reset failed.";
        messageEl.classList.add("error");
      }
    } catch (err) {
      messageEl.textContent = "Network error. Please try again.";
      messageEl.classList.add("error");
    }
  });
</script>
{% endblock %}
